# Rendered at container start by the nginx image's envsubst step (only defined variables are
# replaced, so nginx's own $host etc. stay intact):
#   PORT          port to listen on (80 by default; hosts like Railway inject their own)
#   API_UPSTREAM  where the API lives (http://api:4000 in docker compose)
#   NGINX_LOCAL_RESOLVERS  filled from /etc/resolv.conf, so the API address is re-resolved
#                          when the API container is replaced
server {
  listen ${PORT};
  listen [::]:${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API + uploads proxied to the api container
  location /api/ {
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;
    proxy_read_timeout 120s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|svg)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
